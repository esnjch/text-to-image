<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraAI - 开启你的文字灵感</title>
    <style>
        /* 基础样式复位 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body, html {
            height: 100%;
            overflow-x: hidden;
        }

        /* 背景底图：这里使用了一张高质量的 AI 艺术风格图作为占位 */
        body {
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        /* 蒙版：增加底图质感并确保文字可读 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.2) 100%);
            z-index: -1;
        }

        /* 导航栏 */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 80px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            margin-left: 30px;
            font-size: 14px;
            opacity: 0.8;
            transition: 0.3s;
        }

        .nav-links a:hover {
            opacity: 1;
            color: #00d2ff;
        }

        /* 主体内容 */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 80px);
            text-align: center;
            padding: 0 20px;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-weight: 700;
        }

        h1 span {
            color: #00d2ff;
        }

        p.subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0.9;
            max-width: 600px;
        }

        /* 输入框容器 */
        .prompt-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 8px 8px 8px 30px;
            display: flex;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            transition: 0.3s ease;
        }

        .prompt-container:focus-within {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00d2ff;
            transform: translateY(-5px);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 18px;
            padding: 10px 0;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-generate {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .btn-generate:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
        }

        /* 特性展示 */
        .features {
            display: flex;
            gap: 40px;
            margin-top: 60px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 200px;
        }

        .feature-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #00d2ff;
        }

        .feature-item p {
            font-size: 13px;
            opacity: 0.7;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            nav { padding: 20px; }
            h1 { font-size: 2.5rem; }
            .features { flex-direction: column; gap: 15px; }
            .nav-links { display: none; }
            .prompt-container { border-radius: 20px; flex-direction: column; padding: 20px; }
            input { width: 100%; text-align: center; margin-bottom: 15px; }
            .btn-generate { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <nav>
        <div class="logo">AURA AI</div>
        <div class="nav-links">
            <a href="#">艺术画廊</a>
            <a href="#">价格方案</a>
            <a href="#">模型库</a>
            <a href="#">开发者 API</a>
        </div>
    </nav>

    <main>
        <h1>用文字 <span>重塑视觉</span></h1>
        <p class="subtitle">AuraAI 是领先的图像生成引擎，只需几秒钟，将您的奇思妙想转化为高清艺术大作。</p>

        <div class="prompt-container">
            <input type="text" placeholder="描述你想要生成的画面，例如：赛博朋克风格的未来城市街道...">
            <button class="btn-generate">立即生成</button>
        </div>

        <div class="features">
            <div class="feature-item">
                <h3>大师级画质</h3>
                <p>支持 4K 超清输出与精细纹理修复</p>
            </div>
            <div class="feature-item">
                <h3>极速推理</h3>
                <p>采用分布式计算，出图无需等待</p>
            </div>
            <div class="feature-item">
                <h3>多模态支持</h3>
                <p>支持多种风格模型，满足不同创作需求</p>
            </div>
        </div>
    </main>

</body>
</html>
